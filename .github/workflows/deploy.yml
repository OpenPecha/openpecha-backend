name: Deploy to EC2

on:
    push:
        branches:
            - dev
            - main
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest pytest-asyncio testcontainers

            - name: Run tests
              run: |
                  python -m pytest tests/ -v --ignore=tests/test_database_neo4j.py

    deploy:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ github.ref_name == 'main' && secrets.PROD_EC2_HOST || secrets.DEV_EC2_HOST }}
                  username: ubuntu
                  key: ${{ github.ref_name == 'main' && secrets.PROD_EC2_SSH_KEY || secrets.DEV_EC2_SSH_KEY }}
                  script: |
                      cd /opt/openpecha-backend
                      git fetch origin ${{ github.ref_name }}
                      git checkout ${{ github.ref_name }}
                      git pull origin ${{ github.ref_name }}
                      source .venv/bin/activate
                      pip install -r requirements.txt
                      sudo systemctl restart openpecha-api
