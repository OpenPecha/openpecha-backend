name: Deploy to EC2

on:
    push:
        branches:
            - dev
            - main
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest pytest-asyncio testcontainers

            - name: Run tests
              run: |
                  python -m pytest tests/ -v --ignore=tests/test_database_neo4j.py

    deploy:
        needs: test
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::374169031176:role/GitHubActionSSMRole
                  aws-region: ap-southeast-1

            - name: Create Deployment Script
              run: |
                  cat << 'EOF' > deploy_script.sh
                  cd /opt/openpecha-backend
                  git fetch origin ${{ github.ref_name }}
                  git checkout ${{ github.ref_name }}
                  git pull origin ${{ github.ref_name }}

                  cat << 'ENV_EOF' > .env
                  NEO4J_URI=${{ vars.NEO4J_URI }}
                  NEO4J_USERNAME=${{ vars.NEO4J_USERNAME }}
                  NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
                  AWS_REGION=${{ vars.AWS_REGION }}
                  AWS_S3_BUCKET=${{ vars.AWS_S3_BUCKET }}
                  SEARCH_API_URL=${{ vars.SEARCH_API_URL }}
                  ENVIRONMENT=${{ vars.ENVIRONMENT }}
                  OTEL_ENABLED=${{ vars.OTEL_ENABLED }}
                  OTEL_SERVICE_NAME=${{ vars.OTEL_SERVICE_NAME }}
                  OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
                  OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
                  ENV_EOF

                  [ -d ".venv" ] || python3 -m venv .venv
                  source .venv/bin/activate
                  pip install -r requirements.txt
                  sudo systemctl restart openpecha-api
                  EOF

            - name: Execute via SSM
              run: |
                  SCRIPT_CONTENT=$(cat deploy_script.sh)

                  COMMAND_ID=$(aws ssm send-command \
                      --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
                      --document-name "AWS-RunShellScript" \
                      --parameters "commands=[$(echo "$SCRIPT_CONTENT" | jq -R -s '.')]" \
                      --query "Command.CommandId" \
                      --output text)

                  echo "Deployment started on ${{ vars.EC2_INSTANCE_ID }}. Command ID: $COMMAND_ID"

                  aws ssm wait command-executed \
                      --command-id "$COMMAND_ID" \
                      --instance-id "${{ vars.EC2_INSTANCE_ID }}"
