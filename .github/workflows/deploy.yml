name: Deploy to EC2

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest pytest-asyncio testcontainers

            - name: Run tests
              run: |
                  python -m pytest tests/ -v --ignore=tests/test_database_neo4j.py

    deploy:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ubuntu
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      cd /opt/openpecha-backend
                      git pull origin main
                      echo "COMMIT_SHA=$(git rev-parse HEAD)" > .env
                      source .venv/bin/activate
                      pip install -r requirements.txt
                      sudo systemctl restart openpecha-api
