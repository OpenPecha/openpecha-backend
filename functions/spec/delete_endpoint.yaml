openapi: 3.1.0
info:
  title: OpenPecha Delete Endpoints
  version: '1.0.0'
  description: |
    Delete endpoints for Expression (Text) and Manifestation (Instance) resources.
    These endpoints perform cascading deletes and return detailed information about the deleted entities.

paths:
  /v2/texts/{text_id}:
    delete:
      summary: Delete a text
      description: |
        Delete an expression and all its related entities including all manifestations.
        
        **Cascading Deletes:**
        - The Expression node itself
        - All Manifestations linked via MANIFESTATION_OF relationship
        - For each Manifestation:
          - All Annotations linked via ANNOTATION_OF relationship
          - All Segments linked via SEGMENTATION_OF relationship
          - All References linked via HAS_REFERENCE relationship
          - All alignment relationships
        - All Contributions linked via HAS_CONTRIBUTION relationship
        - The title Nomen linked via HAS_TITLE relationship (including its LocalizedText)
        
        **Relationships Removed:**
        - EXPRESSION_OF (to Work)
        - HAS_LANGUAGE (to Language)
        - TRANSLATION_OF (to other Expression, if exists)
        - COMMENTARY_OF (to other Expression, if exists)
        
        **Note:** This operation is irreversible. Other Expressions that have TRANSLATION_OF 
        or COMMENTARY_OF relationships pointing to this Expression will have those 
        relationships removed (the other Expressions themselves will not be deleted).
      tags:
        - Texts
      operationId: deleteText
      parameters:
        - name: text_id
          in: path
          required: true
          schema:
            type: string
          description: The unique ID of the text to delete
          examples:
            expression_id:
              value: "T12345678"
              summary: A typical expression ID
      responses:
        "200":
          description: Text deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteExpressionResponse'
              examples:
                success:
                  summary: Successful deletion with text details
                  value:
                    message: "Text deleted successfully"
                    text_id: "T12345678"
                    title: "The Great Commentary on Madhyamika Philosophy"
                    instances:
                      - instance_id: "I12345678"
                        annotations:
                          - segmentation:
                              id: ["S001", "S002"]
                          - alignment:
                              aligned_from_id: ["AL001", "AL002"]
                              aligned_to_id: ["AL003", "AL004"]
                          - bibliography:
                              id: ["B001", "B002"]
                      - instance_id: "I12345679"
                        annotations:
                          - segmentation:
                              id: ["S003"]
                          - bibliography:
                              id: ["B003"]
                    deleted_counts:
                      expressions: 1
                      manifestations: 2
                      annotations: 6
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "404":
          description: Text not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Text does not exist
                  value:
                    error: "Text with ID 'T12345678' not found"
        "500":
          $ref: '#/components/responses/ServerError'

  /v2/instances/{instance_id}:
    delete:
      summary: Delete an instance
      description: |
        Delete a manifestation and all its related entities and relationships.
        
        **Cascading Deletes:**
        - The Manifestation node itself
        - All Annotations linked via ANNOTATION_OF relationship
        - All Segments linked via SEGMENTATION_OF relationship (from annotations)
        - All References linked via HAS_REFERENCE relationship (from segments)
        - All alignment relationships (ALIGNED_TO from segments)
        
        **Relationships Removed:**
        - MANIFESTATION_OF (to Expression)
        - HAS_TYPE (to ManifestationType)
        - HAS_COPYRIGHT (to CopyrightStatus)
        - HAS_INCIPIT_TITLE (to Nomen)
        
        **Note:** This operation is irreversible. The parent Expression will remain intact.
      tags:
        - Instances
      operationId: deleteInstance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
          description: The unique ID of the instance to delete
          examples:
            manifestation_id:
              value: "I12345678"
              summary: A typical manifestation ID
      responses:
        "200":
          description: Instance deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteManifestationResponse'
              examples:
                success:
                  summary: Successful deletion with instance details
                  value:
                    message: "Instance deleted successfully"
                    instance_id: "I12345678"
                    annotations:
                      - segmentation:
                          id: ["S001"]
                      - alignment:
                          aligned_from_id: ["AL001", "AL002"]
                          aligned_to_id: ["AL003", "AL004"]
                      - bibliography:
                          id: ["B001"]
                    deleted_counts:
                      manifestations: 1
                      annotations: 3
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Instance does not exist
                  value:
                    error: "Instance with ID 'I12345678' not found"
        "500":
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    InstanceWithAnnotations:
      type: object
      required:
        - instance_id
        - annotations
      properties:
        instance_id:
          type: string
          description: The unique ID of the instance
          examples:
            - "I12345678"
        annotations:
          type: array
          description: List of annotations for this instance
          items:
            $ref: '#/components/schemas/Annotation'

    Annotation:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The unique ID of the annotation
          examples:
            - "A001"
        segmentation:
          type: object
          description: Segmentation information if applicable
          properties:
            id:
              type: string
              description: The unique ID of the segmentation
              examples:
                - "S001"
        alignment:
          type: object
          description: Alignment information if applicable
          properties:
            id:
              type: string
              description: The unique ID of the alignment
              examples:
                - "AL001"
        bibliography:
          type: object
          description: Bibliography information if applicable
          properties:
            id:
              type: string
              description: The unique ID of the bibliography entry
              examples:
                - "B001"
    DeleteManifestationResponse:
      type: object
      required:
        - message
        - instance_id
        - annotations
        - deleted_counts
      properties:
        message:
          type: string
          description: Success message
          examples:
            - "Instance deleted successfully"
        instance_id:
          type: string
          description: The ID of the deleted instance
          examples:
            - "I12345678"
        annotations:
          type: array
          description: List of annotations that were deleted with this instance
          items:
            $ref: '#/components/schemas/Annotation'
        deleted_counts:
          type: object
          description: Count of deleted entities by type
          required:
            - manifestations
            - annotations
            - segments
          properties:
            manifestations:
              type: integer
              minimum: 1
              description: Number of manifestations deleted (always 1)
              examples:
                - 1
            annotations:
              type: integer
              minimum: 0
              description: Number of annotations deleted
              examples:
                - 3
            segments:
              type: integer
              minimum: 0
              description: Number of segments deleted
              examples:
                - 150
            references:
              type: integer
              minimum: 0
              description: Number of references deleted
              examples:
                - 25

    DeleteExpressionResponse:
      type: object
      required:
        - message
        - text_id
        - title
        - instances
        - deleted_counts
      properties:
        message:
          type: string
          description: Success message
          examples:
            - "Text deleted successfully"
        text_id:
          type: string
          description: The ID of the deleted text
          examples:
            - "T12345678"
        title:
          type: string
          description: The title of the deleted text
          examples:
            - "The Great Commentary on Madhyamika Philosophy"
        instances:
          type: array
          description: List of instances that were deleted with this text
          items:
            $ref: '#/components/schemas/InstanceWithAnnotations'
        deleted_counts:
          type: object
          description: Count of deleted entities by type
          required:
            - expressions
            - manifestations
            - annotations
            - segments
          properties:
            expressions:
              type: integer
              minimum: 1
              description: Number of expressions deleted (always 1)
              examples:
                - 1
            manifestations:
              type: integer
              minimum: 0
              description: Number of manifestations deleted
              examples:
                - 2
            annotations:
              type: integer
              minimum: 0
              description: Number of annotations deleted
              examples:
                - 6
            segments:
              type: integer
              minimum: 0
              description: Number of segments deleted
              examples:
                - 300
            references:
              type: integer
              minimum: 0
              description: Number of references deleted
              examples:
                - 50
            contributions:
              type: integer
              minimum: 0
              description: Number of contributions deleted
              examples:
                - 3

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          examples:
            - "Resource not found"
            - "Invalid request"

  responses:
    InvalidRequest:
      description: There was an error with the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_id:
              summary: Invalid ID format
              value:
                error: "Invalid ID format provided"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_not_found:
              value:
                error: "Resource was not found"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            server_error:
              value:
                error: "An internal server error occurred"
