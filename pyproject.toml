[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
exclude = ["tests", ".venv"]
include = ["."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
omit = [
    "tests/*",
    "app/scripts/*",
]

[tool.ruff]
line-length = 120
exclude = ["tests"]
target-version = "py314"

[tool.ty.environment]
root = ["."]

[tool.ty.src]
exclude = ["tests/"]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",  # Trailing comma missing
    "TRY003",
    "EM101",
    "EM102",
    "C901",
    "TD",
    "TC001", # Move application import into a type-checking block
    "TC002",
    "PLR2004", # Magic value used in comparison
    "PLR0911", # Too many return statements
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements
    "N999",  # Invalid module name (false positive from hyphenated repo name)
]

